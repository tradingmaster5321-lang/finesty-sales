name: Build Finesty Sales V1 Pro Customer - PIN 1234 Final
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and patch customer app
        shell: bash
        run: |
          mkdir -p app
          python3 - <<'PY'
          from pathlib import Path
          parts=[]
          for i in range(1,12):
              p=Path(f'source/chunk{i:02d}.txt').read_text(encoding='utf-8')
              if i==7:
                  marker='<label>Invoice<input id=retInv></'
                  pos=p.find(marker)
                  if pos>=0: p=p[:pos+len(marker)]
              parts.append(p)
          html=''.join(parts)
          old="function doLogin(){let p=loginPin.value,u=db.users.find(x=>x.pin===p&&x.active!==false);if(!u){alert('PIN si sahihi');return}user=u;db.sessions.push({id:id(),date:new Date().toISOString(),user:u.username});audit('LOGIN');app()}"
          new="function doLogin(){let input=document.getElementById('loginPin'),msg=document.getElementById('loginMsg'),p=(input?.value||'').trim(),u=db.users.find(x=>String(x.pin)===p&&x.active!==false);if(!p){if(msg){msg.textContent='⚠️ Tafadhali weka PIN yako.';msg.style.color='#b36b00'}return}if(!u){if(msg){msg.textContent='❌ PIN si sahihi. Tafadhali jaribu tena.';msg.style.color='#b83232'}if(input){input.value='';input.focus()}return}if(msg){msg.textContent='✅ PIN ni sahihi. Inaingia kwenye mfumo...';msg.style.color='#14733c'}user=u;db.sessions.push({id:id(),date:new Date().toISOString(),user:u.username});audit('LOGIN');save();setTimeout(()=>{app();if(u.mustChangePin){setTimeout(()=>settings(),120)}},250)}"
          if old not in html: raise SystemExit('login source not found')
          html=html.replace(old,new,1)
          old_ui='<button class="primary" style="width:100%" onclick=doLogin()>Ingia</button><p class=mini>'
          new_ui='<button class="primary" style="width:100%" onclick=doLogin()>Ingia</button><div id=loginMsg class="mini" style="margin-top:12px;text-align:center;font-weight:800;min-height:20px"></div><p class=mini>'
          if old_ui not in html: raise SystemExit('login ui source not found')
          html=html.replace(old_ui,new_ui,1)
          old_activation="db.license={activated:true,code:c,activatedAt:new Date().toISOString(),business:actBiz.value.trim()};audit('SYSTEM_ACTIVATED',actBiz.value.trim());save();toast('Mfumo ume-activate');app()}"
          new_activation="db.license={activated:true,code:c,activatedAt:new Date().toISOString(),business:actBiz.value.trim()};if(!db.users||!db.users.length)db.users=structuredClone(seed.users);db.users[0].pin='1234';db.users[0].mustChangePin=true;audit('SYSTEM_ACTIVATED',actBiz.value.trim());save();toast('Mfumo ume-activate. PIN ya mwanzo ni 1234');app()}"
          if old_activation not in html: raise SystemExit('activation source not found')
          html=html.replace(old_activation,new_activation,1)
          html=html.replace('Baada ya activation, Admin ataingia kwa PIN yake na anaweza kuibadilisha.','Baada ya activation, Admin ataingia kwa PIN ya mwanzo 1234. Akiingia ndani atalazimika kubadilisha PIN yake mwenyewe.',1)
          old_change="me.pin=newpin.value;user=me;audit('PIN_CHANGE');save();toast('PIN imebadilishwa')"
          new_change="me.pin=newpin.value;me.mustChangePin=false;user=me;audit('PIN_CHANGE');save();toast('PIN imebadilishwa kikamilifu');app()"
          if old_change not in html: raise SystemExit('change pin source not found')
          html=html.replace(old_change,new_change,1)
          Path('app/index.html').write_text(html,encoding='utf-8')
          PY
          cp android-customer/android/app/src/main/assets/manifest.json app/manifest.json
          cp app/index.html android-customer/android/app/src/main/assets/index.html
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('app/index.html','utf8');
          const a=s.indexOf('<script>'),b=s.lastIndexOf('</script>'); if(a<0||b<a) throw Error('script missing');
          const m=s.slice(a+8,b); new Function(m);
          for(const x of ['1234','mustChangePin','PIN ya mwanzo ni 1234','PIN imebadilishwa kikamilifu']) if(!m.includes(x)) throw Error('missing '+x);
          console.log('Customer source validation passed');
          NODE
      - name: Generate customer logo
        shell: bash
        run: |
          python3 -m pip install --user Pillow
          mkdir -p android-customer/android/app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          S=512; fp='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; im=Image.new('RGBA',(S,S),(0,0,0,255)); d=ImageDraw.Draw(im)
          d.ellipse((18,18,494,494),fill=(8,8,8,255),outline=(212,175,55,255),width=18); d.ellipse((36,36,476,476),outline=(107,85,21,255),width=3)
          gold=(255,210,26,255); deep=(245,180,0,255); white=(255,255,255,255)
          d.polygon([(176,160),(210,112),(270,118),(350,118),(325,150),(270,150),(232,150),(215,174),(197,197),(215,218),(190,242),(155,214),(160,186),(176,160)],fill=gold)
          d.polygon([(207,205),(250,168),(309,176),(285,207),(246,207),(219,208),(206,230),(186,249),(172,226),(182,215),(207,205)],fill=deep)
          d.polygon([(204,228),(218,228),(230,283),(306,283),(320,236),(335,236),(319,300),(315,313),(301,313),(226,313),(212,313),(209,300),(204,228)],fill=gold)
          d.ellipse((228,321,248,341),fill=gold); d.ellipse((290,321,310,341),fill=gold)
          d.polygon([(342,287),(342,254),(360,244),(360,287),(368,287),(368,238),(386,226),(386,287),(394,287),(394,214),(412,199),(412,287)],fill=gold); d.polygon([(338,302),(377,300),(410,263),(422,250),(420,276),(435,264),(408,312),(350,321)],fill=deep)
          f1=ImageFont.truetype(fp,62); f2=ImageFont.truetype(fp,29); f3=ImageFont.truetype(fp,13)
          def ctr(t,y,f,c,sp=0):
              ws=[d.textlength(ch,font=f) for ch in t]; x=(S-(sum(ws)+sp*(len(t)-1)))/2
              for ch,w in zip(t,ws): d.text((x,y),ch,font=f,fill=c); x+=w+sp
          ctr('FINESTY',350,f1,deep,2); ctr('SALES PRO',398,f2,white,2); ctr('SMART SALES • BETTER BUSINESS',443,f3,gold,1)
          im.save('android-customer/android/app/src/main/res/drawable-nodpi/app_icon.webp',format='WEBP',quality=92,method=6)
          PY
      - name: Setup Java
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Build customer APK
        working-directory: android-customer/android
        run: gradle clean assembleDebug --no-daemon
      - name: Verify and package
        shell: bash
        run: |
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1); test -x "$SDK_APKSIGNER"
          mkdir -p release; cp android-customer/android/app/build/outputs/apk/debug/app-debug.apk release/Finesty_Sales_V1_Pro_Customer.apk
          "$SDK_APKSIGNER" verify --verbose release/Finesty_Sales_V1_Pro_Customer.apk
          "$SDK_APKSIGNER" verify --min-sdk-version 23 release/Finesty_Sales_V1_Pro_Customer.apk
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Finesty-Sales-V1-Pro-Customer-Initial-1234-FINAL
          path: release/Finesty_Sales_V1_Pro_Customer.apk
          if-no-files-found: error
