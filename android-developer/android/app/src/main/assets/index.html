<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finesty Developer Activation Portal</title><style>body{font-family:system-ui;background:#0b0b0b;color:#fff;padding:20px}.box{max-width:620px;margin:30px auto;background:#17130a;border:1px solid #d4a017;border-radius:18px;padding:22px}input,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;font:inherit}input{background:#fff;color:#111}button{background:#d4a017;color:#111;border:0;font-weight:900;cursor:pointer}.code{font-size:24px;letter-spacing:2px;background:#fff;color:#111;padding:15px;border-radius:12px;text-align:center;margin-top:14px;word-break:break-all}.muted{color:#e5d69d;font-size:13px}</style></head><body><div class="box"><h1>Finesty Developer — Activation</h1><p class="muted">Developer-only tool. Usiipe mteja. Itengeneze Activation Code ya Finesty Sales V1 Pro.</p><label>Jina la biashara / mteja</label><input id="biz" placeholder="Mfano: ABC Cosmetics"><button onclick="generate()">Generate Unique Activation Code</button><div id="out"></div></div><script>const DEV_SECRET=['FINSTY','V1','PRO','DEV','2026'].join('-');function rnd(n=4){let chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',o='';for(let i=0;i<n;i++)o+=chars[Math.floor(Math.random()*chars.length)];return o}function codeCheck(raw){let a=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');let sum=0;for(let i=0;i<a.length;i++)sum=(sum+a.charCodeAt(i)*(i+17))%1000003;return String(sum%997).padStart(3,'0')}function generate(){let a=rnd(),b=rnd(),c=rnd(),code='FSP-'+a+'-'+b+'-'+c+'-'+codeCheck(a+b+c+DEV_SECRET);out.innerHTML='<div class="code">'+code+'</div><button onclick="navigator.clipboard?.writeText(\''+code+'\');alert(\'Code ime-copy\')">Copy Code</button><p class="muted">Customer: '+String(biz.value||'').replace(/[<>&]/g,'')+'</p>'}</script></body></html>
