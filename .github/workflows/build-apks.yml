name: Build Finesty Sales V1 Pro APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble and validate customer web app
        shell: bash
        run: |
          mkdir -p app
          python3 - <<'PY'
          from pathlib import Path
          parts=[]
          for i in range(1,12):
              p=Path(f'source/chunk{i:02d}.txt').read_text(encoding='utf-8')
              if i==7:
                  marker='<label>Invoice<input id=retInv></'
                  pos=p.find(marker)
                  if pos>=0:
                      p=p[:pos+len(marker)]
              parts.append(p)
          Path('app/index.html').write_text(''.join(parts),encoding='utf-8')
          PY
          cp android-customer/android/app/src/main/assets/manifest.json app/manifest.json
          cp app/index.html android-customer/android/app/src/main/assets/index.html
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app/index.html','utf8');
          const start=s.indexOf('<script>');
          const end=s.lastIndexOf('</script>');
          if(start<0 || end<start) throw new Error('Customer script not found');
          const m=s.slice(start+8,end);
          new Function(m);
          console.log('Customer JavaScript syntax OK');
          NODE
      - name: Install logo renderer
        shell: bash
        run: python3 -m pip install --user Pillow
      - name: Prepare Finesty Sales app logos
        shell: bash
        run: |
          mkdir -p android-customer/android/app/src/main/res/drawable-nodpi
          mkdir -p android-developer/android/app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          S=512
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def make(path, admin=False):
              im=Image.new('RGBA',(S,S),(0,0,0,255)); d=ImageDraw.Draw(im)
              d.ellipse((18,18,494,494),fill=(8,8,8,255),outline=(212,175,55,255),width=18)
              d.ellipse((36,36,476,476),outline=(107,85,21,255),width=3)
              gold=(255,210,26,255); deep=(245,180,0,255); white=(255,255,255,255)
              d.polygon([(176,160),(210,112),(270,118),(350,118),(325,150),(270,150),(232,150),(215,174),(197,197),(215,218),(190,242),(155,214),(160,186)],fill=gold)
              d.polygon([(207,205),(250,168),(309,176),(285,207),(246,207),(219,208),(206,230),(186,249),(172,226),(182,215)],fill=deep)
              d.polygon([(204,228),(218,228),(230,283),(306,283),(320,236),(335,236),(319,300),(315,313),(301,313),(226,313),(212,313),(209,300)],fill=gold)
              d.ellipse((228,321,248,341),fill=gold); d.ellipse((290,321,310,341),fill=gold)
              d.polygon([(342,287),(342,254),(360,244),(360,287),(368,287),(368,238),(386,226),(386,287),(394,287),(394,214),(412,199),(412,287)],fill=gold)
              d.polygon([(338,302),(377,300),(410,263),(422,250),(420,276),(435,264),(408,312),(350,321)],fill=deep)
              f1=ImageFont.truetype(font_path,62); f2=ImageFont.truetype(font_path,29); f3=ImageFont.truetype(font_path,13)
              def centered(text,y,font,fill,spacing=0):
                  widths=[d.textlength(c,font=font) for c in text]; w=sum(widths)+spacing*(len(text)-1); x=(S-w)/2
                  for c,cw in zip(text,widths): d.text((x,y),c,font=font,fill=fill); x+=cw+spacing
              centered('FINESTY',350,f1,deep,2); centered('SALES PRO',398,f2,white,2); centered('SMART SALES • BETTER BUSINESS',443,f3,gold,1)
              if admin:
                  badge=ImageFont.truetype(font_path,27); text='ADMIN'; box=d.textbbox((0,0),text,font=badge); w=box[2]-box[0]; h=box[3]-box[1]; x=(S-w)/2; y=45
                  d.rounded_rectangle((x-22,y-10,x+w+22,y+h+10),radius=18,fill=(0,0,0,255),outline=(212,175,55,255),width=5); d.text((x,y),text,font=badge,fill=gold)
              im.save(path,format='WEBP',quality=92,method=6)
          make('android-customer/android/app/src/main/res/drawable-nodpi/app_icon.webp',False)
          make('android-developer/android/app/src/main/res/drawable-nodpi/app_icon.webp',True)
          PY
          file android-customer/android/app/src/main/res/drawable-nodpi/app_icon.webp
          file android-developer/android/app/src/main/res/drawable-nodpi/app_icon.webp
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build customer APK
        working-directory: android-customer/android
        run: gradle assembleDebug --no-daemon
      - name: Build developer APK
        working-directory: android-developer/android
        run: gradle assembleDebug --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Finesty-Sales-V1-Pro-APKs
          path: |
            android-customer/android/app/build/outputs/apk/debug/*.apk
            android-developer/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error