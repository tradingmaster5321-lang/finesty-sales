<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json"><title>Finesty Sales</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f8fafc;color:#0f172a}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #0000000a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:5px 0 10px;font-size:16px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#0f172a;color:white;font-weight:700;font-size:15px}.btn.gold{background:#f2c94c;color:#111827}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{background:#e2e8f0;color:#0f172a}.hidden{display:none!important}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}.money{font-weight:800}.pill{padding:5px 9px;border-radius:999px;background:#d1fae5;color:#047857;font-size:12px}.ok{color:#047857}.err{color:#b91c1c;font-weight:600}.loading{opacity:.6;pointer-events:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><section id="login" class="card"><h1>Finesty <span style="color:#d39f12">Sales</span></h1><p>POS • Stock • Customers • Reports</p><label>Email</label><input id="email" class="field" type="email" value="tradingmaster5321@gmail.com" autocomplete="username"><label>Password</label><input id="password" class="field" type="password" autocomplete="current-password"><button id="loginBtn" class="btn gold" onclick="login()">Ingia</button><p id="msg"></p></section><section id="app" class="hidden"><header class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1 style="margin:0">Finesty Sales</h1><small id="user"></small></div><button class="btn" onclick="logout()">Toka</button></div><div class="nav" style="margin-top:14px"><button class="btn" onclick="show('dash')">Dashboard</button><button class="btn" onclick="show('pos')">POS</button><button class="btn" onclick="show('products')">Products</button><button class="btn" onclick="show('sales')">Sales</button></div></header><section id="dash" class="page"><div class="grid"><div class="card"><small>Sales</small><h2 id="dSales">TSh 0</h2></div><div class="card"><small>Profit</small><h2 id="dProfit">TSh 0</h2></div><div class="card"><small>Products</small><h2 id="dProducts">0</h2></div></div></section><section id="products" class="page hidden"><div class="card"><h2>Products</h2><div class="grid"><input id="pn" class="field" placeholder="Product name"><input id="sku" class="field" placeholder="SKU"><input id="buy" class="field" type="number" placeholder="Buying price"><input id="sell" class="field" type="number" placeholder="Selling price"><input id="stock" class="field" type="number" placeholder="Stock"><input id="min" class="field" type="number" value="5" placeholder="Minimum stock"></div><button class="btn gold" onclick="addProduct()">Add product</button></div><div class="card"><table><thead><tr><th>Name</th><th>SKU</th><th>Sell</th><th>Stock</th></tr></thead><tbody id="productRows"></tbody></table></div></section><section id="pos" class="page hidden"><div class="card"><h2>POS</h2><input id="search" class="field" placeholder="Search product..." oninput="renderPos()"><div id="posList"></div><hr><div id="cart"></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="discount" class="field" style="max-width:180px" type="number" value="0" placeholder="Discount"><select id="payment" class="field" style="max-width:180px"><option>Cash</option><option>M-Pesa</option><option>Airtel Money</option><option>Mixx by Yas</option><option>Bank</option><option>Credit</option></select><button class="btn gold" onclick="sell()">Complete Sale</button></div><h2 id="total">TSh 0</h2></div></section><section id="sales" class="page hidden"><div class="card"><h2>Recent Sales</h2><table><thead><tr><th>Date</th><th>Receipt</th><th>Total</th><th>Payment</th></tr></thead><tbody id="salesRows"></tbody></table></div></section></section></main><script>const URL='https://ymdqpepiozjrcwjnraoz.supabase.co',KEY='sb_publishable_nhXVfMz48REWg0khhWJaAA_7vYzZiHi';let sb,products=[],sales=[],cart=[];const $=id=>document.getElementById(id),money=n=>'TSh '+Number(n||0).toLocaleString();function msg(t,err=false){$('msg').textContent=t;$('msg').className=err?'err':'ok'}function setBusy(v){$('loginBtn').disabled=v;$('loginBtn').textContent=v?'Inaingia...':'Ingia';$('login').classList.toggle('loading',v)}async function login(){msg('');let email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg('Weka email na password.',true);return}setBusy(true);try{if(!window.supabase){throw new Error('Huduma ya login haijapakia. Refresh ukurasa.')}if(!sb)sb=window.supabase.createClient(URL,KEY);let r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data||!r.data.user)throw new Error('Login haikurudisha user.');msg('Login imefanikiwa. Inapakia...');await start(r.data.user)}catch(e){console.error(e);msg('Login imeshindikana: '+(e.message||'Unknown error'),true)}finally{setBusy(false)}}async function start(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=u.email;try{await load();show('dash')}catch(e){console.error(e);alert('Imeshindikana kupakia data: '+(e.message||e))}}async function logout(){if(sb)await sb.auth.signOut();location.reload()}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');if(id==='pos')renderPos()}async function load(){if(!sb)sb=window.supabase.createClient(URL,KEY);let p=await sb.from('products').select('*').order('name');if(p.error)throw p.error;products=p.data||[];let s=await sb.from('sales').select('*').order('created_at',{ascending:false}).limit(100);if(s.error)throw s.error;sales=s.data||[];renderProducts();renderSales();$('dProducts').textContent=products.length;$('dSales').textContent=money(sales.reduce((a,x)=>a+Number(x.total||0),0));$('dProfit').textContent=money(sales.reduce((a,x)=>a+Number(x.profit||0),0))}function renderProducts(){$('productRows').innerHTML=products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku||'')}</td><td>${money(p.selling_price)}</td><td><span class="pill">${p.stock}</span></td></tr>`).join('')||'<tr><td colspan="4">No products</td></tr>'}function renderSales(){$('salesRows').innerHTML=sales.map(s=>`<tr><td>${new Date(s.created_at).toLocaleString()}</td><td>${esc(s.receipt_no)}</td><td class="money">${money(s.total)}</td><td>${esc(s.payment_method)}</td></tr>`).join('')||'<tr><td colspan="4">No sales</td></tr>'}async function addProduct(){let v={name:$('pn').value.trim(),sku:$('sku').value.trim(),buying_price:+$('buy').value||0,selling_price:+$('sell').value||0,stock:+$('stock').value||0,min_stock:+$('min').value||5};if(!v.name||v.selling_price<=0)return alert('Jaza jina na bei ya kuuza');let{error}=await sb.from('products').insert(v);if(error)return alert(error.message);['pn','sku','buy','sell','stock'].forEach(x=>$(x).value='');await load()}function renderPos(){let q=$('search').value.toLowerCase();$('posList').innerHTML=products.filter(p=>(p.name+' '+(p.sku||'')).toLowerCase().includes(q)).map(p=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b>${esc(p.name)}</b><br><small>${money(p.selling_price)} • Stock ${p.stock}</small></div><button class="btn" onclick="addCart('${p.id}')">Add</button></div>`).join('')||'<p>No products found.</p>'}function addCart(id){let p=products.find(x=>x.id===id);if(!p||p.stock<1)return;let x=cart.find(x=>x.product_id===id);if(x){if(x.qty<p.stock)x.qty++}else cart.push({product_id:p.id,name:p.name,qty:1});renderCart()}function renderCart(){$('cart').innerHTML=cart.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0"><span>${esc(x.name)} × ${x.qty}</span><span>${money(x.qty*products.find(p=>p.id===x.product_id).selling_price)} <button onclick="cart.splice(${i},1);renderCart()">×</button></span></div>`).join('')||'<p>No items</p>';let t=cart.reduce((a,x)=>a+x.qty*products.find(p=>p.id===x.product_id).selling_price,0)-Number($('discount').value||0);$('total').textContent=money(Math.max(0,t))}$('discount').addEventListener('input',renderCart);async function sell(){if(!cart.length)return alert('Weka bidhaa kwenye cart');let disc=Number($('discount').value||0),items=cart.map(x=>({product_id:x.product_id,qty:x.qty})),receipt='FS-'+Date.now();let{error}=await sb.rpc('create_sale',{p_receipt_no:receipt,p_customer_id:null,p_customer_name:'Walk-in',p_payment_method:$('payment').value,p_discount:disc,p_items:items});if(error)return alert(error.message);cart=[];$('discount').value=0;await load();renderCart();alert('Sale imehifadhiwa: '+receipt);show('dash')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.addEventListener('load',async()=>{try{if(window.supabase)sb=window.supabase.createClient(URL,KEY);let{data}=await sb.auth.getSession();if(data.session)await start(data.session.user)}catch(e){console.error(e)}});$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
