name: Build Finesty Sales V1 Pro Customer - Initial Password
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-customer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and patch customer app
        shell: bash
        run: |
          mkdir -p app
          python3 - <<'PY'
          from pathlib import Path
          parts=[]
          for i in range(1,12):
              p=Path(f'source/chunk{i:02d}.txt').read_text(encoding='utf-8')
              if i==7:
                  marker='<label>Invoice<input id=retInv></'
                  pos=p.find(marker)
                  if pos>=0:
                      p=p[:pos+len(marker)]
              parts.append(p)
          html=''.join(parts)

          # Keep the customer login feedback fix.
          old="function doLogin(){let p=loginPin.value,u=db.users.find(x=>x.pin===p&&x.active!==false);if(!u){alert('PIN si sahihi');return}user=u;db.sessions.push({id:id(),date:new Date().toISOString(),user:u.username});audit('LOGIN');app()}"
          new="function doLogin(){let input=document.getElementById('loginPin'),msg=document.getElementById('loginMsg'),p=(input?.value||'').trim(),u=db.users.find(x=>String(x.pin)===p&&x.active!==false);if(!p){if(msg){msg.textContent='⚠️ Tafadhali weka PIN yako.';msg.style.color='#b36b00'}return}if(!u){if(msg){msg.textContent='❌ PIN si sahihi. Tafadhali jaribu tena.';msg.style.color='#b83232'}if(input){input.value='';input.focus()}return}if(msg){msg.textContent='✅ PIN ni sahihi. Inaingia kwenye mfumo...';msg.style.color='#14733c'}user=u;db.sessions.push({id:id(),date:new Date().toISOString(),user:u.username});audit('LOGIN');save();setTimeout(()=>{app();if(u.mustChangePin){setTimeout(()=>settings(),120)}},250)}"
          if old not in html:
              raise SystemExit('Expected login function not found')
          html=html.replace(old,new,1)

          old_ui='<button class="primary" style="width:100%" onclick=doLogin()>Ingia</button><p class=mini>'
          new_ui='<button class="primary" style="width:100%" onclick=doLogin()>Ingia</button><div id=loginMsg class="mini" style="margin-top:12px;text-align:center;font-weight:800;min-height:20px"></div><p class=mini>'
          if old_ui not in html:
              raise SystemExit('Expected login UI not found')
          html=html.replace(old_ui,new_ui,1)

          # After activation, the customer's first/admin PIN is ALWAYS 1234 and
          # the customer is forced into Settings to choose a new PIN after login.
          old_activation="db.license={activated:true,code:c,activatedAt:new Date().toISOString(),business:actBiz.value.trim()};audit('SYSTEM_ACTIVATED',actBiz.value.trim());save();toast('Mfumo ume-activate');app()}"
          new_activation="db.license={activated:true,code:c,activatedAt:new Date().toISOString(),business:actBiz.value.trim()};if(!db.users||!db.users.length)db.users=structuredClone(seed.users);db.users[0].pin='1234';db.users[0].mustChangePin=true;audit('SYSTEM_ACTIVATED',actBiz.value.trim());save();toast('Mfumo ume-activate. PIN ya mwanzo ni 1234');app()}"
          if old_activation not in html:
              raise SystemExit('Expected activation handler not found')
          html=html.replace(old_activation,new_activation,1)

          # Make the activation screen explicitly tell the customer the initial PIN.
          html=html.replace('Baada ya activation, Admin ataingia kwa PIN yake na anaweza kuibadilisha.','Baada ya activation, Admin ataingia kwa PIN ya mwanzo 1234. Akiingia ndani atalazimika kubadilisha PIN yake mwenyewe.',1)

          # Clear the forced-change flag after the customer successfully changes PIN.
          old_change="me.pin=newpin.value;user=me;audit('PIN_CHANGE');save();toast('PIN imebadilishwa')"
          new_change="me.pin=newpin.value;me.mustChangePin=false;user=me;audit('PIN_CHANGE');save();toast('PIN imebadilishwa kikamilifu');app()"
          if old_change not in html:
              raise SystemExit('Expected changePin handler not found')
          html=html.replace(old_change,new_change,1)

          Path('app/index.html').write_text(html,encoding='utf-8')
          PY
          cp android-customer/android/app/src/main/assets/manifest.json app/manifest.json
          cp app/index.html android-customer/android/app/src/main/assets/index.html

          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app/index.html','utf8');
          const start=s.indexOf('<script>');
          const end=s.lastIndexOf('</script>');
          if(start<0 || end<start) throw new Error('Customer script not found');
          const m=s.slice(start+8,end);
          new Function(m);
          for (const x of ['1234','mustChangePin','PIN ya mwanzo ni 1234','PIN imebadilishwa kikamilifu']) {
            if(!m.includes(x)) throw new Error('Expected customer password-change feature missing: '+x);
          }
          console.log('Customer JavaScript syntax OK; initial PIN 1234 + forced PIN change verified');
          NODE

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build customer APK only
        working-directory: android-customer/android
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -x "$SDK_APKSIGNER"
          mkdir -p release
          cp android-customer/android/app/build/outputs/apk/debug/app-debug.apk release/Finesty_Sales_V1_Pro_Customer.apk
          "$SDK_APKSIGNER" verify --verbose release/Finesty_Sales_V1_Pro_Customer.apk
          "$SDK_APKSIGNER" verify --min-sdk-version 23 release/Finesty_Sales_V1_Pro_Customer.apk
          ls -lh release/Finesty_Sales_V1_Pro_Customer.apk

      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Finesty-Sales-V1-Pro-Customer-Initial-1234
          path: release/Finesty_Sales_V1_Pro_Customer.apk
          if-no-files-found: error
